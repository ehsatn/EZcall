name: Build ezcall IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify the Swift relay protocol
        run: |
          xcrun --sdk macosx swiftc ios/ezcall/RelayWire.swift ios/Checks/WireCheck.swift -o "$RUNNER_TEMP/ezcall-wire-check"
          "$RUNNER_TEMP/ezcall-wire-check" tests/protocol-v1.json

      - name: Verify call playback buffering
        run: |
          xcrun --sdk macosx swiftc ios/ezcall/RelayWire.swift ios/ezcall/CallAudio.swift ios/Checks/AudioJitterCheck.swift -o "$RUNNER_TEMP/ezcall-audio-check"
          "$RUNNER_TEMP/ezcall-audio-check"

      - name: Build for a physical iPhone
        run: |
          xcodebuild -project ios/ezcall.xcodeproj -scheme ezcall -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/ezcallBuild" \
            CODE_SIGNING_ALLOWED=NO build

      - name: Package and check the unsigned IPA
        run: |
          app="$RUNNER_TEMP/ezcallBuild/Build/Products/Release-iphoneos/ezcall.app"
          test "$(plutil -extract CFBundleDisplayName raw "$app/Info.plist")" = ezcall
          test "$(plutil -extract CFBundleIcons.CFBundlePrimaryIcon.CFBundleIconName raw "$app/Info.plist")" = EzcallAppIcon
          xcrun lipo "$app/ezcall" -verify_arch arm64
          package="$(mktemp -d)"
          mkdir "$package/Payload"
          ditto "$app" "$package/Payload/ezcall.app"
          ditto -c -k --norsrc --keepParent "$package/Payload" "$RUNNER_TEMP/ezcall-unsigned.ipa"
          unzip -tqq "$RUNNER_TEMP/ezcall-unsigned.ipa"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ezcall-unsigned
          path: ${{ runner.temp }}/ezcall-unsigned.ipa
          if-no-files-found: error
          retention-days: 1
